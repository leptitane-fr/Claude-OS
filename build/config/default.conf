# Claude-OS -- configuration de build.
#
# Copier en local.conf pour personnaliser ; local.conf est lu apres
# default.conf et n'est pas versionne.

# --- Cible -----------------------------------------------------------------
# Deux modes, exclusifs :
#
#   image  (defaut)  ./build/build.sh --image claude-os.img
#                    Construit un fichier image a ecrire ensuite sur la cle
#                    depuis n'importe quel systeme, Windows compris.
#
#   device           ./build/build.sh --device /dev/sdb
#                    Ecrit directement sur une cle, depuis un hote Linux.
#
# Peripherique bloc pour le mode device. TOUJOURS verifier avec lsblk avant.
TARGET_DEVICE=""

# Taille de l'image produite en mode image.
#
# Le systeme installe occupe environ 3 Gio ; le pic est atteint pendant
# l'installation des paquets, quand le cache apt ajoute ~1,5 Gio avant
# d'etre vide. 6 Gio couvrent ce pic avec de la marge.
#
# Ne pas surdimensionner : chaque gigaoctet est un gigaoctet a ECRIRE sur la
# cle, et une ecriture longue est une ecriture fragile -- une reinitialisation
# du controleur USB en cours de route suffit a tuer le programme de flashage.
# La partition racine s'etend de toute facon au premier demarrage.
IMAGE_SIZE_MB=6144                   # 6 GiB

# --- Distribution ----------------------------------------------------------
SUITE="trixie"                       # Debian 13 (stable)
MIRROR="http://deb.debian.org/debian"
COMPONENTS="main contrib non-free-firmware non-free"

# --- Identite --------------------------------------------------------------
HOSTNAME="claude-os"
USERNAME="stef"
USER_FULLNAME="Stef"
LOCALE="fr_FR.UTF-8"
KEYMAP="fr"
TIMEZONE="Europe/Paris"

# --- Partitionnement -------------------------------------------------------
SIZE_ESP=512                         # MiB

# Proportion du support occupee par la partition racine apres extension au
# premier demarrage. Le reste est laisse HORS partition a dessein : faute de
# TRIM fiable, un controleur de cle flash ne sait pas quels blocs sont libres
# et ne peut pas les recycler ; des secteurs jamais ecrits, eux, lui restent
# disponibles pour son wear-leveling.
FILL_PERCENT=70

# --- GPU NVIDIA ------------------------------------------------------------
#   auto     : le systeme interroge le materiel au demarrage et choisit
#              lui-meme -- c'est le bon reglage, notamment parce qu'une image
#              est fabriquee sans connaitre la machine cible
#   mux      : desactivation cote firmware via asus-nb-wmi (ideal si dispo)
#   pr3      : runtime D3cold via les power resources ACPI du pont PCIe
#   remove   : retrait du peripherique PCI apres le demarrage (repli)
#   none     : blacklist seul -- DEGRADE l'autonomie, a eviter
#
# Le resultat reel se lit apres coup :  journalctl -b -u claude-os-dgpu-power
DGPU_STRATEGY="auto"

# Blacklister le module vmd rend le SSD interne (Windows) invisible au noyau.
#
# Actif par defaut, et sans risque de se tromper : si le BIOS n'est pas en
# mode Intel VMD/RST, aucun peripherique ne reclame ce module et le
# blacklister ne change rien. S'il l'est, le SSD Windows devient
# materiellement inaccessible -- la garantie de non-ecriture la plus solide
# qu'on puisse obtenir, bien plus qu'une discipline de montage.
#
# Le revers : depuis Claude-OS, tu ne pourras pas lire tes fichiers Windows.
BLACKLIST_VMD="yes"

# --- Fonctionnalites -------------------------------------------------------
# Cowork lance ses taches dans une VM QEMU/KVM. Sur une cle flash, cela
# signifie une image disque volumineuse, des ecritures intensives et une
# ponction serieuse sur la batterie. Desactive par defaut.
ENABLE_COWORK="no"

# Noyau plus recent depuis trixie-backports (meilleure gestion d'energie
# sur les plateformes recentes, au prix d'une exposition un peu moindre).
ENABLE_BACKPORTS_KERNEL="no"
