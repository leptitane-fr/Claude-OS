# Claude-OS -- configuration de build.
#
# Copier en local.conf pour personnaliser ; local.conf est lu apres
# default.conf et n'est pas versionne.

# --- Cible -----------------------------------------------------------------
# Peripherique bloc de la cle USB. TOUJOURS verifier avec lsblk avant.
# Laisser vide force le script a le demander interactivement.
TARGET_DEVICE=""

# --- Distribution ----------------------------------------------------------
SUITE="trixie"                       # Debian 13 (stable)
MIRROR="http://deb.debian.org/debian"
COMPONENTS="main contrib non-free-firmware non-free"

# --- Identite --------------------------------------------------------------
HOSTNAME="claude-os"
USERNAME="stef"
USER_FULLNAME="Stef"
LOCALE="fr_FR.UTF-8"
KEYMAP="fr"
TIMEZONE="Europe/Paris"

# --- Partitionnement (MiB ; 0 = reste de l'espace) -------------------------
SIZE_ESP=512
SIZE_ROOT=61440                      # 60 GiB : large pour Chromium + Claude Desktop
SIZE_HOME=102400                     # 100 GiB
# Le reste (~90 GiB sur 256 Go) est laisse NON ALLOUE a dessein :
# sur une cle flash, l'espace jamais ecrit sert de reserve au wear-leveling
# du controleur et prolonge nettement la duree de vie du support.

# --- GPU NVIDIA ------------------------------------------------------------
# Renseigner apres analyse de tools/hw-probe.sh.
#   pr3      : runtime D3cold via power resources ACPI (methode preferee)
#   remove   : retrait du peripherique PCI apres le boot (repli)
#   mux      : desactivation cote firmware via asus-nb-wmi (ideal si dispo)
#   none     : blacklist seul -- DEGRADE l'autonomie, a eviter
DGPU_STRATEGY="pr3"

# Blacklister le module vmd rend le SSD interne (Windows) invisible au noyau.
# N'activer que si hw-probe a confirme la presence d'Intel VMD/RST.
BLACKLIST_VMD="no"

# --- Fonctionnalites -------------------------------------------------------
# Cowork lance ses taches dans une VM QEMU/KVM. Sur une cle flash, cela
# signifie une image disque volumineuse, des ecritures intensives et une
# ponction serieuse sur la batterie. Desactive par defaut.
ENABLE_COWORK="no"

# Noyau plus recent depuis trixie-backports (meilleure gestion d'energie
# sur les plateformes recentes, au prix d'une exposition un peu moindre).
ENABLE_BACKPORTS_KERNEL="no"
