name: Construire l'image Claude-OS

on:
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier l'image dans une release"
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils de construction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            debootstrap gdisk dosfstools e2fsprogs mtools parted xz-utils \
            qemu-system-x86 ovmf

      # Le disque de / est trop petit pour une image de 11 Gio ; /mnt en a 60.
      - name: Preparer l'espace de travail
        run: |
          sudo mkdir -p /mnt/build
          sudo chown "$USER:$USER" /mnt/build
          df -h / /mnt

      - name: Construire l'image
        env:
          CLAUDE_OS_PASSWORD: claude
        run: sudo -E ./build/build.sh --image /mnt/build/claude-os.img

      # ---------------------------------------------------------------------
      # Verification de la chaine Secure Boot.
      #
      # OVMF_VARS_4M.ms.fd embarque les cles Microsoft et applique reellement
      # Secure Boot. Si le shim n'etait pas correctement signe, le firmware
      # refuserait de demarrer : atteindre l'invite de connexion prouve que
      # toute la chaine shim -> GRUB -> noyau est valide.
      # ---------------------------------------------------------------------
      - name: Tester le demarrage sous Secure Boot (QEMU + OVMF)
        run: |
          cp /usr/share/OVMF/OVMF_VARS_4M.ms.fd /mnt/build/vars.fd
          chmod +w /mnt/build/vars.fd
          KVM=""; [ -w /dev/kvm ] && KVM="-enable-kvm -cpu host"
          echo "acceleration : ${KVM:-aucune (TCG, plus lent)}"

          set +e
          timeout 600 qemu-system-x86_64 $KVM -m 2048 -smp 2 -nographic \
            -machine q35 \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.secboot.fd \
            -drive if=pflash,format=raw,unit=1,file=/mnt/build/vars.fd \
            -drive id=usbdisk,file=/mnt/build/claude-os.img,format=raw,if=none \
            -device qemu-xhci -device usb-storage,drive=usbdisk \
            -serial mon:stdio -display none \
            | tee /mnt/build/boot.log
          set -e

          echo "::group::Sortie serie"
          tail -80 /mnt/build/boot.log
          echo "::endgroup::"

          if grep -qi 'Security Violation\|access denied' /mnt/build/boot.log; then
            echo "::error::Le firmware a refuse le binaire : chaine Secure Boot invalide"
            exit 1
          fi
          if grep -q 'login:' /mnt/build/boot.log; then
            echo "OK : invite de connexion atteinte sous Secure Boot applique"
          else
            echo "::error::Invite de connexion jamais atteinte -- voir la sortie serie"
            exit 1
          fi

      - name: Compresser
        run: |
          cd /mnt/build
          xz -9 -T0 --verbose claude-os.img
          sha256sum claude-os.img.xz > claude-os.img.xz.sha256
          ls -lh claude-os.img.xz

          # Une release GitHub refuse tout fichier de plus de 2 Gio.
          SIZE=$(stat -c%s claude-os.img.xz)
          echo "taille compressee : $(( SIZE / 1048576 )) Mio"
          if [ "$SIZE" -gt $(( 2 * 1024 * 1024 * 1024 )) ]; then
            echo "::error::Image trop volumineuse pour une release GitHub (> 2 Gio)."
            echo "::error::Alleger build/packages.list ou reduire IMAGE_SIZE_MB."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: claude-os-image
          path: |
            /mnt/build/claude-os.img.xz
            /mnt/build/claude-os.img.xz.sha256
          retention-days: 14
          compression-level: 0     # deja compresse en xz

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "${{ github.ref_type }}" = "tag" ] || TAG="build-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" \
            /mnt/build/claude-os.img.xz \
            /mnt/build/claude-os.img.xz.sha256 \
            --title "Claude-OS $TAG" \
            --notes "Image a ecrire sur la cle USB. Voir docs/flasher-depuis-windows.md.

          Demarrage verifie sous Secure Boot applique (OVMF avec cles Microsoft).
          Mot de passe initial : \`claude\` -- changement impose a la premiere connexion." \
            || gh release upload "$TAG" /mnt/build/claude-os.img.xz --clobber
