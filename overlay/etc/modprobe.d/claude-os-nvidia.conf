# Claude-OS -- neutralisation du GPU NVIDIA discret.
#
# ATTENTION : ce fichier ne suffit pas, et pris isolement il est NUISIBLE.
# Sans pilote pour negocier sa mise en veille, une RTX 4060 reste en D0 et
# consomme 10 a 20 W en continu. Le blacklist doit imperativement etre
# accompagne de la mise en D3cold assuree par claude-os-dgpu-power.service.
#
# Le blacklist reel se fait via module_blacklist= sur la ligne de commande
# noyau (cf. /etc/default/grub) ; ces directives sont une seconde barriere.

blacklist nouveau
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm
blacklist nvidiafb
blacklist rivafb

install nouveau /bin/false
install nvidia  /bin/false
