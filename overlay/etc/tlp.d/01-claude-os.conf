# Claude-OS -- politique d'energie TLP.
#
# TLP est retenu plutot que power-profiles-daemon : nettement plus agressif
# et bien plus finement reglable. Les deux sont incompatibles ; ppd est
# masque par build.sh.

TLP_ENABLE=1
TLP_DEFAULT_MODE=BAT
TLP_PERSISTENT_DEFAULT=0

# --- CPU -------------------------------------------------------------------
# Sur Alder Lake-H, intel_pstate en mode passif + EPP fait l'essentiel du
# travail. On laisse le turbo sur secteur, on le coupe sur batterie : c'est
# le reglage au meilleur rapport autonomie / gene percue, car le turbo est
# tres couteux en watts pour un gain reel modeste sur des usages web.
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power

# --- Peripheriques ---------------------------------------------------------
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto

# Le dGPU NVIDIA est gere separement par claude-os-dgpu-power.service, qui
# doit rester seul maitre de son etat.
RUNTIME_PM_DENYLIST="@DGPU_BDF@"

WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# --- USB : LE POINT CRITIQUE -----------------------------------------------
#
# La racine du systeme vit sur une cle USB. Si TLP endort le peripherique qui
# la porte, le systeme de fichiers se bloque et la machine gele -- panne
# spectaculaire et difficile a diagnostiquer.
#
# En mode image, la cle n'est pas connue a la construction : l'autosuspend
# part desactive, et claude-os-firstboot renseigne l'exclusion puis le
# reactive une fois la cle identifiee. En mode peripherique, l'identifiant
# vendor:product est connu et inscrit directement ci-dessous.
USB_AUTOSUSPEND=@USB_AUTOSUSPEND@
USB_DENYLIST="@USB_DENYLIST@"
USB_EXCLUDE_BTUSB=1
USB_EXCLUDE_PHONE=1

# --- Disques ---------------------------------------------------------------
# Aucune mise en veille par rotation : la cle n'a pas de plateau, et une
# tentative de spin-down sur du flash ne produit que des erreurs.
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=0
DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="254 254"
