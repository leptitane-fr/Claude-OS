# Claude-OS -- discipline d'ecriture sur support flash.
#
# Chaque reglage sert deux objectifs a la fois : menager une cle USB qui n'a
# ni TRIM fiable ni wear-leveling evolue, et reduire les reveils du systeme.

# Repousse l'ecriture des pages sales : les ecritures sont regroupees en
# rafales espacees plutot qu'egrenees en permanence.
vm.dirty_writeback_centisecs = 6000
vm.dirty_expire_centisecs    = 6000
vm.dirty_background_ratio    = 10
vm.dirty_ratio               = 30

# zram est en RAM et compresse : il est bien plus rapide qu'un swap sur cle
# USB, et surtout il n'use pas le flash. On peut donc swapper volontiers.
vm.swappiness = 150

# Moins de reveils du noyau au repos.
kernel.nmi_watchdog = 0
