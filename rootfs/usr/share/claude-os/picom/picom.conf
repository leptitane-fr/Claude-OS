#-------------------------------------------------------------------------------
# Claude OS — Compositeur
#
# Le flou a été retiré : coûteux sur un GPU 32 EU à 6 W, et sans apport réel
# une fois les ombres en place. Ce sont elles qui font la lisibilité, en
# détachant chaque surface de ce qu'il y a derrière.
#
# Ombres volontairement légères et centrées : elles doivent séparer les plans,
# pas se voir. Un décalage nul les rend symétriques, ce qui convient à des
# panneaux flottants qu'aucune source lumineuse ne surplombe.
#-------------------------------------------------------------------------------

backend = "glx";
vsync = true;
use-damage = true;

#--- Coins arrondis : aucun, côté compositeur
#
# picom arrondit les QUATRE coins ou aucun — il n'expose pas d'option par coin
# (corner-radius, corner-radius-rules et rounded-corners-exclude agissent tous
# sur la fenêtre entière). L'arrondi voulu ne portant que sur les deux coins
# hauts, un arrondi global produirait deux coins bas arrondis non désirés.
#
# On met donc 0, et l'arrondi supérieur vient de ceux qui savent le dessiner :
#   - Chromium et Claude Desktop tracent eux-mêmes leur cadre, coins hauts
#     adoucis compris ;
#   - plank et tint2 dessinent leurs propres coins (TopRoundness côté plank,
#     « rounded » côté tint2), ils n'ont jamais eu besoin de picom pour ça.
#
# Restent carrées les fenêtres décorées par Openbox : bloc-notes, gestionnaire
# de fichiers, boîtes de dialogue. Voir docs/04 §4.3.
corner-radius = 0;

#--- Ombres : fenêtres, dock, barre d'état
#
# Seul élément qui détache une fenêtre du fond, puisqu'il n'y a plus aucun
# contour. Légèrement décalée vers le bas : une ombre parfaitement centrée
# donne un halo, pas un relief.
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.32;
shadow-offset-x = -16;
shadow-offset-y = -10;
shadow-color = "#000000";

# Seul le bureau en est exclu : une ombre sur le fond d'écran n'a pas de sens
# et créerait un liseré sombre sur les bords de l'écran.
shadow-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Pcmanfm' && window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@"
];

#--- Flou : désactivé
# Pour le réactiver : blur-method = "dual_kawase"; blur-strength = 4;
# Le panneau de réglages (claude-os-settings) le fait sans éditer ce fichier.
blur-method = "none";

#--- Transitions
fading = true;
fade-in-step = 0.09;
fade-out-step = 0.09;
fade-delta = 8;

#--- Opacité : les applications restent parfaitement opaques
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
