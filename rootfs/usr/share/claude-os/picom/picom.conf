#-------------------------------------------------------------------------------
# Claude OS — Compositeur
#
# C'est picom qui produit l'aspect ChromeOS : coins arrondis, translucidité et
# flou derrière les panneaux, ombres portées douces.
#
# Contrainte matérielle : UHD Graphics Jasper Lake, 32 EU, 6 W. Le flou n'est
# appliqué qu'aux fenêtres translucides — soit uniquement les deux panneaux,
# quelques centaines de pixels de haut. Un flou plein écran serait hors budget.
# Si l'affichage devait saccader, passer blur-method à "none" : c'est le premier
# réglage à sacrifier.
#-------------------------------------------------------------------------------

backend = "glx";
vsync = true;
use-damage = true;

# Coins arrondis, à l'exception du fond d'écran
corner-radius = 14;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Xfdesktop'"
];

# Ombres — discrètes, jamais sur les panneaux ni le fond
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.35;
shadow-offset-x = -18;
shadow-offset-y = -14;
shadow-color = "#000000";
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "name = 'claude-os-dock'",
  "name = 'claude-os-status'",
  "class_g = 'Tint2'"
];

# Flou derrière les surfaces translucides
blur-method = "dual_kawase";
blur-strength = 4;
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Chromium'",
  "class_g = 'Claude'"
];

# Transitions — courtes, pour rester perçues comme fluides
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;
fade-exclude = [ "class_g = 'Tint2'" ];

# Les applications restent parfaitement opaques : lisibilité avant effet
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
