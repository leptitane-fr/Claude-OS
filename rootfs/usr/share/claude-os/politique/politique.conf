# Claude OS — politique du guichet root
#
# Ce fichier est la RÉFÉRENCE, livrée par le dépôt. La copie qui fait foi est
# /etc/claude-os/politique.conf ; elle n'est écrite qu'une fois, à la
# fourniture, et jamais écrasée par une mise à jour. Vos réglages vous
# appartiennent.
#
# Il est lu par claude-os-root, en root : c'est du shell, il fait donc
# partie des cibles de niveau 3. Une action privilégiée ne peut pas le
# modifier sans qu'un humain ait approuvé.
#
# Après modification :  claude-os-root --expliquer <commande>  pour vérifier
# que la commande tombe bien dans le niveau attendu.

#--- Instantanés -------------------------------------------------------------
#
# auto      instantané avant chaque écriture, si la racine est en btrfs ;
#           sinon on exécute quand même, avec un avertissement.
# toujours  instantané obligatoire : pas d'instantané, pas d'exécution.
#           C'est le réglage strict, à retenir une fois btrfs confirmé.
# jamais    aucun instantané. Le journal reste tenu, mais plus rien n'est
#           annulable. À n'utiliser que pour un dépannage.
instantanes=auto

# Combien d'instantanés garder. Chacun ne coûte que ses différences, mais sur
# un eMMC de 64 Go la place manque vite : les plus anciens sont supprimés
# au-delà de ce nombre.
instantanes_garder=20

# Où déposer les instantanés quand /.snapshots (sous-volume @snapshots) n'est
# pas monté. Ce repli fonctionne, mais les instantanés se retrouvent DANS @ :
# un retour arrière les emporterait. Monter @snapshots reste préférable.
instantanes_dir=/.instantanes

#--- Journal -----------------------------------------------------------------
# Une ligne par action privilégiée : date, niveau, instantané, code de retour,
# demandeur, motif, commande. Doublé dans journald sous « claude-os-root ».
journal=/var/log/claude-os/actions.log

#--- Ajustements du classement -----------------------------------------------
#
# Des motifs glob, séparés par des espaces, comparés à la commande ENTIÈRE.
# Toujours penser à encadrer par « * » : la comparaison porte sur toute la
# ligne, pas sur un morceau.
#
# À monter en niveau 3 — ce qui exigera une confirmation humaine. C'est le
# réglage qu'on ajuste ; l'autre est à manier avec prudence.
#   niveau3_supplementaire="*rclone*config* *tailscale*up*"
niveau3_supplementaire=""

# À descendre en niveau 1 — exécution directe, SANS instantané. Ne mettre ici
# que ce dont on est certain que cela ne peut rien écrire. Une erreur ici ne
# se voit pas : elle se paie le jour où l'on cherche l'instantané qui n'a pas
# été pris.
#   niveau1_supplementaire="*smartctl?-a* *powertop?--help*"
niveau1_supplementaire=""
