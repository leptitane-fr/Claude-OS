# Claude OS — sortie audio de la carte SOF.
#
# POURQUOI CONTOURNER ACP
#
# PipeWire construit d'ordinaire ses sorties par ACP (Alsa Card Profile), qui
# s'appuie sur un profil UCM pour savoir quel PCM est le haut-parleur et lequel
# est le casque. Or alsa-ucm-conf ne fournit AUCUN profil pour « sof-rt5682 » :
# ChromeOS livrait le sien, il n'est pas dans Debian, et il n'existe pas non
# plus en amont.
#
# Sans profil, ACP marque « Stereo Output » indisponible, laisse la carte sur
# « Off », et le nœud de repli qu'il finit par créer n'accepte aucun flux
# (« no target node available »). Mesuré le 8 septembre 2026.
#
# use-acp = false fait créer un nœud par PCM matériel. On perd la bascule
# automatique casque/haut-parleur au branchement — elle reviendra le jour où un
# profil UCM existera — mais le son sort.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.*jsl_rt5682.*" } ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
      }
    }
  }
]
