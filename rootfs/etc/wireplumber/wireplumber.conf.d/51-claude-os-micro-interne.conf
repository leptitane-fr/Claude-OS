# Claude OS — microphone interne (DMIC) de MADOO.
#
# DEUX CAPSULES, QUATRE CANAUX
#
# Le DSP expose le micro interne sur hw:0,5 en QUATRE canaux, alors que la
# machine n'en a que DEUX :
#
#   canal 0 (FL), canal 1 (FR) : les vraies capsules
#   canal 2, canal 3           : une valeur FIGÉE, à -6,6 dBFS
#
# Mesuré le 18 septembre 2026 : sur les deux derniers, RMS (0,465) et crête
# (0,481) sont presque égales — la ligne ne bouge pas. Ce n'est pas de
# l'audio, c'est une entrée jamais câblée restée à un niveau fixe.
#
# La cause est l'absence de table ACPI NHLT dans le firmware MrChromebox :
# rien ne dit au DSP combien de capsules sont réellement là, et la topologie
# générique en déclare quatre.
#
# Sans la règle ci-dessous, PipeWire mélange les quatre canaux vers de la
# stéréo : la constante des canaux 2 et 3 écrase une voix captée à -42 dBFS,
# et le micro paraît muet. UNK les marque comme non attribués, ce qui les
# exclut du mélange.
#
# LA PRIORITÉ, ET POURQUOI ELLE EST RELEVÉE
#
# Par défaut, « Headset » (hw:0,1, l'entrée du JACK) sort à 1728 contre 1664
# au micro interne : c'est donc le jack qui était choisi, et il rend du zéro
# absolu quand rien n'y est branché. Faute de profil UCM, rien ne bascule au
# branchement (voir 99-claude-os-audio.conf) : le bon défaut est le micro qui
# fonctionne toujours. Brancher un casque-micro demande donc de le choisir à
# la main.
#
# POUR REVENIR EN ARRIÈRE : supprimer ce fichier et redémarrer WirePlumber.
#   claude-os-root rm /etc/wireplumber/wireplumber.conf.d/51-claude-os-micro-interne.conf
#   systemctl --user restart wireplumber

monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_input.pci-0000_00_1f.3-platform-jsl_rt5682_def.capture.5.0" } ]
    actions = {
      update-props = {
        audio.position   = [ FL, FR, UNK, UNK ]
        priority.session = 1900
        node.description = "Micro interne (DMIC)"
      }
    }
  }
]
