# Claude OS — désigner explicitement le fournisseur des portails XDG.
#
# SANS CE FICHIER, LE THÈME NE SORT PAS DU SHELL.
#
# xdg-desktop-portal-gtk déclare, dans son gtk.portal :
#
#     Interfaces=…;org.freedesktop.impl.portal.Settings;
#     UseIn=gnome
#
# Il sait donc publier « color-scheme » — c'est lui qui traduit le réglage
# GNOME en org.freedesktop.appearance, l'espace que Chromium, Claude Desktop
# et GTK 4 interrogent pour savoir s'il faut être clair ou sombre.
#
# Mais « UseIn=gnome » : le portail frontal ne le choisit que sur un bureau
# qui s'annonce GNOME. Notre session pose XDG_CURRENT_DESKTOP=labwc, donc
# aucun fournisseur n'était retenu, l'interface Settings n'existait pas sur
# le bus, et les applications n'avaient rien à lire.
#
# Mesuré : sans ce fichier, l'appel à Settings.ReadOne répond « No such
# interface ». Avec, il répond 1 pour sombre et 2 pour clair, et le signal
# SettingChanged part à chaque bascule — les fenêtres déjà ouvertes suivent.
[preferred]
default=gtk
