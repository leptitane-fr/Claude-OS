# rpcbind ne doit pas écouter sur le réseau.
#
# /etc/default/rpcbind NE SUFFIT PAS, et c'est le piège : rpcbind est activé
# par socket. C'est systemd qui ouvre les ports, avant même que le démon ne
# démarre, et les OPTIONS du fichier default n'ont alors plus rien à décider.
# Mesuré le 9 septembre 2026 : après « OPTIONS=-h 127.0.0.1 » et un
# redémarrage du service, ss montrait toujours 0.0.0.0:111.
#
# La première ligne vide REMET LA LISTE À ZÉRO. Sans elle, les directives qui
# suivent s'ajouteraient aux ports publics de l'unité d'origine au lieu de
# les remplacer — et le port resterait ouvert, en silence.
[Socket]
ListenStream=
ListenDatagram=
ListenStream=/run/rpcbind.sock
ListenStream=127.0.0.1:111
ListenDatagram=127.0.0.1:111
ListenStream=[::1]:111
ListenDatagram=[::1]:111
