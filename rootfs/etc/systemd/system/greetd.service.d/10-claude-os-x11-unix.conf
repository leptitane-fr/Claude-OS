# Claude OS — garantir /tmp/.X11-unix AVANT que greetd ne démarre.
#
# POURQUOI LA RÈGLE tmpfiles NE SUFFISAIT PAS
#
# labwc démarre Xwayland à l'ouverture et traite son échec comme fatal.
# Xwayland refuse /tmp/.X11-unix s'il n'appartient ni à root ni à
# l'utilisateur courant — et wlroots CRÉE le répertoire s'il ne le trouve pas,
# au nom du compte qui tourne à ce moment-là.
#
# L'écran de connexion tourne sous « _greetd ». S'il arrive avant
# systemd-tmpfiles, c'est lui qui crée le répertoire et en devient
# propriétaire ; la session de l'utilisateur, ouverte ensuite, ne peut plus
# s'en servir et meurt en une seconde. En boucle, l'écran de connexion
# revenant à chaque fois.
#
# La règle /etc/tmpfiles.d/claude-os-x11.conf reste — elle couvre les
# démarrages où greetd n'est pas en jeu — mais elle ne s'exécute qu'une fois,
# tôt, et rien ne garantit qu'elle passe avant le premier Xwayland. Une
# correction qui dépend d'un ordonnancement qu'on n'a pas vérifié n'est pas
# une correction : c'est un pari, et il a été perdu au premier redémarrage.
#
# ExecStartPre, lui, s'exécute en root immédiatement avant greetd, à CHAQUE
# démarrage du service et à chaque redémarrage automatique. Il n'y a plus de
# course à gagner.
#
# « install -d » fait les trois gestes d'un coup, et reprend un répertoire
# existant mal possédé — vérifié dans les deux cas, absent et mal possédé.
[Service]
ExecStartPre=/usr/bin/install -d -m 1777 -o root -g root /tmp/.X11-unix
