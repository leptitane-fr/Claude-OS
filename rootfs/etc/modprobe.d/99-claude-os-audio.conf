# Claude OS — pilotes audio concurrents mis à l'écart.
#
# Le contrôleur audio 00:1f.3 (Jasper Lake HD Audio) correspond à trois
# pilotes différents, qui déclarent tous le même identifiant PCI :
#
#   sof-audio-pci-intel-icl   pile SOF — c'est elle qui pilote la carte
#   snd_hda_intel             pilote HDA classique
#   snd_soc_avs               pile ASoC AVS
#
# Les deux derniers sont chargés au démarrage, enregistrent un pilote PCI,
# et repartent sans rien piloter : « Used by 0 », aucun périphérique lié,
# aucun module dépendant. Ils ne servent qu'à mettre trois candidats en
# concurrence sur une sonde qui a déjà échoué une fois au démarrage
# (IPC timeout sur le widget DMIC, voir le journal noyau).
#
# Le gain mémoire est négligeable (268 Kio) : l'objet est d'assainir la
# séquence de sonde, pas d'économiser de la RAM.
#
# POUR REVENIR EN ARRIÈRE : supprimer ce fichier et redémarrer.
#   claude-os-root rm /etc/modprobe.d/99-claude-os-audio.conf
#
# ATTENTION : ces deux pilotes constituaient un filet de secours théorique
# si la pile SOF venait à ne pas sonder du tout. Ce filet disparaît ici.
# Si l'audio est absent après un démarrage, supprimer ce fichier est la
# première chose à essayer.

blacklist snd_hda_intel
blacklist snd_soc_avs
