# Claude OS — /tmp/.X11-unix doit appartenir à root.
#
# LA PANNE QUE CETTE LIGNE ÉVITE
#
# labwc est compilé avec Xwayland (Debian le lui impose : « labwc Depends:
# xwayland »), et il le démarre à l'ouverture. Xwayland refuse de créer sa
# socket si /tmp/.X11-unix n'appartient ni à root ni à l'utilisateur courant
# — et labwc considère cet échec comme FATAL :
#
#   [ERROR] xwayland/sockets.c: /tmp/.X11-unix not owned by root or us
#   [ERROR] xwayland/sockets.c: No display available in the first 33
#   [ERROR] src/xwayland.c: cannot create xwayland server
#
# Or l'écran de connexion tourne sous « _greetd » (uid 102). Si c'est lui qui
# crée le répertoire en premier, il en devient propriétaire — et la session de
# l'utilisateur, ouverte ensuite, ne peut plus s'en servir. Le compositeur
# meurt en une seconde, greetd réaffiche l'écran de connexion, et l'on boucle
# indéfiniment sans jamais ouvrir le bureau.
#
# L'asymétrie est ce qui rend la panne déroutante : l'écran de connexion
# fonctionne parfaitement, le mot de passe est accepté, et seule la session
# échoue. Constaté sur la machine le 7 septembre 2026. Voir docs/06.
#
# Créé par root avec le bit collant, le répertoire sert aux deux comptes.
# Ce fichier est dans /etc/tmpfiles.d, qui prime sur /usr/lib/tmpfiles.d :
# la règle vaut même si le paquet qui la fournissait d'ordinaire a été retiré.
d /tmp/.X11-unix 1777 root root -
