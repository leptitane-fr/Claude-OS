# Claude OS — gestion d'énergie
#
# Ligne de conduite : économiser sans dégrader l'usage. Tout réglage qui
# provoque des micro-coupures, des déconnexions ou un temps de réveil sensible
# est écarté, même s'il rapporte quelques milliwatts. Sur un Jasper Lake 6 W,
# l'essentiel se joue ailleurs — sur le décodage vidéo matériel et sur le fait
# de ne pas faire tourner de services inutiles.

TLP_ENABLE=1
TLP_DEFAULT_MODE=BAT
TLP_PERSISTENT_DEFAULT=0

#--- Processeur
# intel_pstate en « powersave » n'est pas un mode dégradé : c'est le mode
# normal du pilote, qui monte en fréquence à la demande. « performance »
# maintiendrait des fréquences hautes en permanence, sans gain perçu ici.
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

# Le boost reste actif sur batterie : c'est lui qui rend l'interface réactive
# sur quatre cœurs à 6 W. Le couper économiserait peu et se sentirait beaucoup.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1

PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power

#--- Périphériques
# USB_AUTOSUSPEND désactivé volontairement : c'est le réglage qui fait
# « décrocher » souris, clés et casques USB. Le gain ne vaut pas la gêne.
USB_AUTOSUSPEND=0
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto

#--- Wi-Fi
# Économie d'énergie Wi-Fi sur batterie seulement : elle ajoute quelques
# millisecondes de latence, invisibles en navigation, gênantes en visio.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

#--- Audio
# Un délai de mise en veille du codec trop court produit un « clic » audible
# à chaque reprise. Une seconde évite ça tout en coupant l'alimentation entre
# deux lectures.
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

#--- Stockage eMMC
DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="128 128"
DISK_IOSCHED="none none"

#--- Rien n'est coupé automatiquement au démarrage
DEVICES_TO_DISABLE_ON_STARTUP=""
RESTORE_DEVICE_STATE_ON_STARTUP=1
