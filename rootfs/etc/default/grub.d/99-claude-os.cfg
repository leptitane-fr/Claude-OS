# Claude OS — paramètres noyau
#
# Appliquer avec « update-grub ». Debian lit ce répertoire en complément de
# /etc/default/grub, ce qui évite de modifier un fichier livré par la
# distribution.

CLAUDE_OS_PARAMS=""

# Compression du tampon d'affichage : le GPU relit moins souvent la mémoire,
# ce qui se voit sur l'autonomie en affichage statique — soit l'essentiel du
# temps quand on lit une page web. Sans effet visible sur l'image.
CLAUDE_OS_PARAMS="$CLAUDE_OS_PARAMS i915.enable_fbc=1"

# Veille S3, et non s2idle. Le firmware MrChromebox annonce « supports S0 S3
# S4 S5 » : contrairement au firmware ChromeOS d'origine, il offre bien le S3.
# Mesure du 16 septembre 2026 : s2idle ne se réveille JAMAIS sur cette machine
# — 98 tentatives, 98 gels, le journal s'arrêtant net sur « PM: suspend entry
# (s2idle) », puis l'EC réinitialisant le processeur (« ap hang detected »)
# au bout de 64 s. En S3, 5 réveils sur 5. Ne pas revenir à s2idle sans
# remesurer.
CLAUDE_OS_PARAMS="$CLAUDE_OS_PARAMS mem_sleep_default=deep"

# Surveillance NMI : utile au débogage noyau, sans objet ici, et elle réveille
# chaque cœur périodiquement.
CLAUDE_OS_PARAMS="$CLAUDE_OS_PARAMS nmi_watchdog=0"

# À ESSAYER, PAS ACTIVÉ PAR DÉFAUT — Panel Self Refresh. Gain d'autonomie réel
# sur affichage statique, mais provoque un scintillement sur certaines dalles.
# Décommenter, redémarrer, et observer une page fixe pendant une minute.
#CLAUDE_OS_PARAMS="$CLAUDE_OS_PARAMS i915.enable_psr=1"

GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT$CLAUDE_OS_PARAMS"
