<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Claude OS — la cloche du centre de notifications.

       LE COMMENTAIRE EST *DANS* LE SVG, ET PAS AU-DESSUS.

       Placé avant la balise <svg>, il repoussait celle-ci au-delà de la
       fenêtre que gdk-pixbuf examine pour reconnaître le format. GTK
       trouvait bien le fichier et refusait de le lire :

           Gtk-WARNING : Failed to load icon
           …/claude-os-cloche-symbolic.svg : Format d'image non reconnu

       Un commentaire de documentation peut donc casser une image. Celui-ci
       vit à l'intérieur, où il ne gêne ni la détection ni le rendu.

       LIVRÉE AVEC LE SHELL, ET PAS EMPRUNTÉE AU THÈME.

       Adwaita ne connaît aucune cloche : seulement
       « preferences-system-notifications-symbolic », une bulle de dialogue.
       Papirus en a une, mais en dépendre ferait apparaître un carré barré
       chez qui change de thème d'icônes — l'erreur que console.c documente
       déjà pour la luminosité.

       Le suffixe « -symbolic » suffit à ce que GTK la recolore avec la
       couleur du texte courant : elle suit le thème clair comme sombre, et
       passe en blanc sur l'accent sans qu'il faille une seconde image. -->
  <path fill="#222222" d="M8 1.5a1 1 0 0 0-1 1v.55A4.5 4.5 0 0 0 3.5 7.4v2.26l-.92 1.6A.75.75 0 0 0 3.23 12.4h9.54a.75.75 0 0 0 .65-1.13l-.92-1.6V7.4A4.5 4.5 0 0 0 9 3.05V2.5a1 1 0 0 0-1-1zm0 2.9A3 3 0 0 1 11 7.4v2.46c0 .13.03.26.1.37l.5.87H4.4l.5-.87c.07-.11.1-.24.1-.37V7.4a3 3 0 0 1 3-3z"/>
  <path fill="#222222" d="M6.25 13.4a1.75 1.75 0 0 0 3.5 0z"/>
</svg>
